services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "54321:54321"
    environment:
      - APP_PORT=54321
      - APP_SESSION_TOKEN=local-dev-token
      - DEBUG=True
    volumes:
      - ../backend:/app
    command: uvicorn core.main:app --host 0.0.0.0 --port 54321 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_ENABLE_MOCK=true
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
