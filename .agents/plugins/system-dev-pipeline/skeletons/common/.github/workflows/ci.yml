name: CI Pipeline

on:
  push:
    branches: [ main, feature, "feature/**", "revision/**" ]
  pull_request:
    branches: [ main ]

jobs:
  harness-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Harness Guard Mechanical Verification
        run: |
          if [ -f scripts/harness_guard.py ]; then
            python3 scripts/harness_guard.py --all
          fi

  backend-checks:
    runs-on: ubuntu-latest
    needs: harness-guard
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff mypy
      - name: Lint with Ruff
        run: ruff check .
      - name: Type check with Mypy
        run: mypy .
      - name: Run Smoke Tests
        run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    needs: harness-guard
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build Test
        run: npm run build
        env:
          VITE_ENABLE_MOCK: "false"
